services:
  - type: web
    name: veloham-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    plan: starter
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: veloham-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: API_BASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: FREEDOMPAY_MERCHANT_ID
        sync: false
      - key: FREEDOMPAY_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: UPLOAD_DIR
        value: /var/data/uploads
    disk:
      name: veloham-uploads
      mountPath: /var/data
      sizeGB: 1

databases:
  - name: veloham-db
    plan: basic-256mb
    databaseName: veloham
    user: veloham
