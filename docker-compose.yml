services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veloham
      POSTGRES_USER: veloham
      POSTGRES_PASSWORD: veloham
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veloham -d veloham"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      APP_ENV: development
      PORT: 8080
      DATABASE_URL: postgres://veloham:veloham@postgres:5432/veloham?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-before-production}
      CORS_ORIGIN: http://127.0.0.1:5173,http://localhost:5173
      UPLOAD_DIR: uploads
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"
    volumes:
      - ./backend/uploads:/app/uploads

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
